# ═══════════════════════════════════════════════════════════════════════════
#  nginx — virtual-textile
#
#  Kurulum:
#    cp infra/nginx/vt.conf       /etc/nginx/sites-available/vt
#    cp infra/nginx/vt-cache.conf /etc/nginx/conf.d/vt-cache.conf   # ⚠️ ZORUNLU
#    ln -sf /etc/nginx/sites-available/vt /etc/nginx/sites-enabled/vt
#    rm -f /etc/nginx/sites-enabled/vt-api          # eski, yalnızca API'ye giden
#    nginx -t && systemctl reload nginx
#
#  ⚠️ İKİ DOSYA, İKİSİ DE KOPYALANIR. `vt-cache.conf` içindeki
#     `proxy_cache_path` yalnızca `http{}` bağlamında geçerli olduğu için
#     buraya konulamaz. Kopyalanmazsa aşağıdaki `location /medya/` bloğu
#     "zone vt_medya not found" ile `nginx -t`i düşürür — yüksek sesle,
#     ki iyi haber budur.
#
#  ⚠️ `default_server` DEĞİL. Bu makinede başka projeler de barınıyor;
#     varsayılan sunucu olmak, adı eşleşmeyen HER isteği bu uygulamaya
#     yönlendirir ve komşu projelerin trafiğini sessizce çalar.
# ═══════════════════════════════════════════════════════════════════════════

server {
  listen 80;
  server_name 91.99.183.64;

  # Gövde sınırı JSON içindir. ⚠️ Kullanıcı fotoğrafı ve ürün görseli BURADAN
  # GEÇMEZ: yükleme imzalı URL ile doğrudan R2'ye yapılır (bkz. media modülü).
  # Sınırı "yükleme için" büyütmek, gereksiz yere büyük gövdeleri kabul etmek olur.
  client_max_body_size 2m;

  # ── API ────────────────────────────────────────────────────────────────
  #
  # ⚠️ SIRA ÖNEMLİ: `/v1` öneki `/` konumundan ÖNCE tanımlanır. nginx en uzun
  #    öneki seçer, ama okuyan insan için sıra da bir belgedir.
  #
  # ⚠️ `/v1` YOLU DEĞİŞMEDİ. Frontend eklendiğinde kök `/` Next'e devredildi;
  #    API'nin adresi korunmasaydı halihazırda `http://.../v1/products`
  #    çağıran her istemci (mobil, test, izleme) sessizce kırılırdı.
  location /v1 {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚠️ Tamponlama KAPALI: stil danışmanı text/event-stream döndürüyor.
    #    Açık kalsaydı nginx yanıtı biriktirir ve akış tek seferde inerdi —
    #    kullanıcı 20 saniye boş ekrana bakar, "akış" özelliği görünmez olurdu.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Sağlık ucu — izleme ve PM2 için. Erişim logu yazılmaz, gürültü olur.
  # ⚠️ Kimlik İSTEMEZ ve istememeli: bir kez `@Public()` unutuldu ve /health
  #    401 döndü; sağlıksız sanılan süreç sonsuz yeniden başlatma döngüsüne girer.
  location = /health {
    proxy_pass http://127.0.0.1:3010/health;
    access_log off;
  }

  # ── Next.js statik varlıkları ──────────────────────────────────────────
  #
  # ⚠️ İçerik özeti dosya adındadır (`/_next/static/<hash>/...`), bu yüzden
  #    `immutable` güvenlidir: dosya değişirse adı da değişir. Bu başlık
  #    olmadan tarayıcı her gezinmede yeniden doğrulama yapar.
  location /_next/static {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Medya (R2 önbelleği) ───────────────────────────────────────────────
  #
  #  ⚠️ KÖPRÜ — KALDIRILMA KOŞULU YAZILIDIR.
  #     R2'ye özel alan adı bağlandığı gün ŞU ÜÇÜ BİRLİKTE kaldırılır:
  #       1. bu blok,
  #       2. infra/nginx/vt-cache.conf,
  #       3. `NEXT_PUBLIC_MEDIA_URL`in `/medya`ya bakan değeri.
  #     Bu not olmazsa "çözüldü" sanılıp kalıcılaşır. Gerekçe ve ölçümler:
  #     docs/medya-dagitimi.md
  #
  #  NEDEN VAR: `pub-<hash>.r2.dev` Cloudflare'in GELİŞTİRME adresidir ve hız
  #  sınırlıdır. Aynı anahtara ardışık istekler ÖLÇÜLDÜ (2026-08-13):
  #      8 istekte 4 başarısız — curl çıkış kodu 35 (SSL connect error).
  #  429 değil: TCP kuruluyor, TLS EL SIKIŞMASI düşürülüyor, gövde yok.
  #  Adın iki A kaydı var (104.18.54.45 / 104.18.50.34) ve İKİSİ DE düşürüyor,
  #  yani tek bir "kötü kenar sunucu" değil, ada yapışık bir sınır.
  #
  #  ⚠️ GÖREVDEKİ TEŞHİSİN DÜZELTMESİ: "tarayıcı r2.dev'e gidiyor" DOĞRU DEĞİL.
  #     Canlı ana sayfanın HTML'i ölçüldü: her görsel `/_next/image?url=...`,
  #     yani zaten BİZİM sunucumuz. r2.dev'e giden Next'in görsel iyileştiricisi,
  #     SUNUCU TARAFINDAN. Asıl israf DEĞİŞKEN BAŞINA YENİDEN ÇEKİM: Next'in
  #     önbelleği (url, genişlik, kalite, Accept) ile anahtarlanır; aynı kaynak
  #     8 genişlik × 3 format ≈ KAYNAK BAŞINA ~24 ayrı upstream çekimi demektir.
  #     Kaynak seviyesinde önbellek YOKTU. Bu bloğun gerçek işi 24'ü 1'e indirmek.
  location /medya/ {
    # ⚠️ SALT OKUMA. Bu blok olmadan sunucumuz, kovaya rastgele HTTP yöntemi
    #    ileten açık bir vekil olur. Genel kova imzasız yazmayı zaten reddeder,
    #    ama reddi uzak tarafa bırakmak bir güvenlik kararı değildir.
    limit_except GET HEAD { deny all; }

    # ═══════════════════════════════════════════════════════════════════════
    #  ⚠️ ÜST KAYNAK BU TURDA r2.dev'DEN KENDİ API'MİZE ÇEVRİLDİ.
    #
    #  Blok, r2.dev'i vekilleyip önbelleğe alıyordu. Ölçüm (2026-08-13) o yolun
    #  ARTIK ISINAMAYACAĞINI gösterdi:
    #      DNS  → 4 kayıt çözülüyor              ✓
    #      TCP  → :443 bağlanıyor                ✓
    #      GET  → 8 istekte 8 zaman aşımı        ✗  (curl rc=28)
    #      cloudflare.com aynı anda 200          → ağ sorunu DEĞİL
    #      R2'nin S3 ucu aynı anda 400           → kova AYAKTA, nesneler yerinde
    #  TCP kuruluyor, TLS EL SIKIŞMASI düşürülüyor. Önbellek doğru bir fikirdi
    #  ama ISINMASI için ilk isteğin BAŞARILI olması gerekiyor; 8/8 düşünce
    #  önbellek hiç dolmuyor. Yani sorun önbellekte değil, ÜST KAYNAKTAYDI.
    #
    #  Yeni üst kaynak: `vt-api` → `GET /v1/media/<anahtar>`. API nesneyi R2'nin
    #  S3 API'sinden okuyup kendisi veriyor; o uç aynı geliştirme sınırına tabi
    #  değil (seed 278 görseli oraya sorunsuz yükledi). Önbellek, kilit, bayat
    #  kopya ve ölçüm başlığı AYNEN KALIYOR — API'yi görsel trafiğiyle
    #  dövmemek için hepsi hâlâ gerekli.
    #
    #  ⚠️ TLS/SNI/resolver satırları SİLİNDİ ve silinmeleri ZORUNLUYDU: üst
    #     kaynak artık aynı makinede, düz HTTP ve sabit adres. `proxy_ssl_*`
    #     bırakılsaydı nginx 127.0.0.1'e TLS ile bağlanmaya çalışırdı.
    #
    #  ⚠️ ANAHTAR ŞEMASI DENETİMİ API'DE, BURADA DEĞİL. nginx `/medya/` altında
    #     ne gelirse iletir; private anahtarları (user-photos/, tryon/, …)
    #     eleyen iki kapı `media-public.controller.ts` içinde. Kapıyı vekile
    #     yazmak, ikinci bir yerde tutulan ve ayrışabilen bir liste demekti.
    # ═══════════════════════════════════════════════════════════════════════

    # `/medya/products/x/y/original` → `/v1/media/products/x/y/original`
    # ⚠️ SONDAKİ `?` SORGU DİZESİNİ DÜŞÜRÜR ve bu ZORUNLU: önbellek anahtarı
    #    (aşağıda) sorgu dizesini saymıyor. Düşürülmeseydi `/medya/a?x=1` ile
    #    `/medya/a` AYNI anahtara yazılır ama FARKLI upstream isteği yapardı —
    #    yani önbellek zehirlenmesi.
    rewrite ^/medya/(.*)$ /v1/media/$1? break;

    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ⚠️ Üst kaynak tek bir yerel süreç; "başka bir adrese dene" diye bir şey
    #    yok. Tekrar denemenin tek anlamlı hâli, süreç yeniden başlarken
    #    yakalanan kısa pencere.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 8s;

    proxy_cache vt_medya;

    # ⚠️ ANAHTAR `$uri` — rewrite SONRASI, yani R2 anahtarının tam yolu.
    #    Sorgu dizesi anahtara GİRMEZ: R2 anahtarı nesnenin tam kimliğidir.
    #    Yan fayda: rastgele sorgu dizesi ekleyerek önbelleği şişirme (ve
    #    dolayısıyla r2.dev'i dolaylı olarak dövdürme) yolu kapanır.
    proxy_cache_key "$uri";

    # ═══ HATALI YANIT ÖNBELLEĞE ALINMAZ ═══
    #  Aşağıda YALNIZCA iki durum kodu listelidir. `proxy_cache_valid any ...`
    #  BİLİNÇLİ OLARAK YOKTUR ve eklenmemelidir:
    #    · 5xx, bağlantı hatası ve zaman aşımı HİÇBİR KOŞULDA yazılmaz.
    #      r2.dev'in arızası TAM OLARAK bu sınıftır (TLS düşmesi → 502);
    #      onu 90 gün önbelleğe almak, geçici bir arızayı KALICI kırık görsele
    #      çevirirdi. nginx varsayılanı da budur, ama burada YAZILI olması
    #      gerekiyor — bir sonraki tur "neden any yok" diye eklemesin.
    #    · 404 tek istisna ve YALNIZCA 1 DAKİKA. Sıfır olsaydı var olmayan bir
    #      anahtar r2.dev'i döver (düzeltmeye çalıştığımız şeyin ta kendisi);
    #      uzun olsaydı YENİ YÜKLENEN afiş o süre boyunca kırık görünürdü.
    proxy_cache_valid 200 90d;
    proxy_cache_valid 404 1m;

    # ⚠️ Upstream'in kendi `Cache-Control`ü yok sayılır, YOKSA r2.dev'in kısa
    #    (ya da eksik) başlığı yukarıdaki 90 günü geçersiz kılardı.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # Nesnede ETag var; süre dolduğunda tam indirme yerine 304 alınır.
    proxy_cache_revalidate on;

    # ⚠️ SOĞUK ANAHTAR FIRTINASI KALKANI: aynı anahtarı isteyen N eşzamanlı
    #    istekten yalnızca BİRİ upstream'e gider, diğerleri sonucu bekler.
    #    Olmasaydı ilk trafik dalgası r2.dev'e onlarca eşzamanlı istek atardı —
    #    limiti tetiklemek için ideal koşul.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    # Süresi dolmuş nesne arka planda tazelenirken kullanıcıya BEKLETMEDEN
    # eski kopya verilir; upstream düşükse kullanıcı hiç etkilenmez.
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # ⚠️ BAYAT KOPYA YOKSA BU KALKAN İŞE YARAMAZ. İlk dağıtımda önbellek BOŞTUR;
    #    bu yüzden `scripts/deploy.sh` env çevrilmeden önce anahtarları ISITIR.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    # ⚠️ ÖLÇÜLEBİLİRLİK — BU BAŞLIK OLMADAN HİÇBİR ŞEY "ÇÖZÜLDÜ" SAYILMAZ.
    #    HIT/MISS/EXPIRED/STALE/UPDATING değerlerini taşır; dağıtım betiği
    #    bunu okuyup önbelleğin gerçekten çalıştığını kanıtlıyor.
    add_header X-Medya-Onbellek $upstream_cache_status always;

    # Tarayıcıya ve Next'in görsel iyileştiricisine uzun ömür verilir.
    # ⚠️ DAYANDIĞI DEĞİŞMEZ: medya anahtarları YERİNDE GÜNCELLENMEZ — yeni
    #    görsel yeni UUID demektir (`products/<urunId>/<gorselId>/...`,
    #    `site/banner/<siteImageId>/...`). O gün gelirse bu satır da değişmeli.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000" always;

    access_log off;
  }

  # ── Web (Next.js) ──────────────────────────────────────────────────────
  #
  # Vitrin, satıcı ve yönetim panelleri + `/api/*` altındaki oturum vekili.
  # ⚠️ Vekil yolu `/api`dir, API'nin `/v1`i ile ÇAKIŞMAZ. Frontend'in kendi
  #    route handler'ları buradan geçer; jeton yalnızca o süreçte bulunur.
  location / {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Danışman akışı vekilden de geçebilir.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # ═════════════════════════════════════════════════════════════════════════
  #  ⚠️ TLS YOK — GERÇEK KULLANICI ALINMADAN ÖNCE KAPATILMASI ZORUNLU.
  #
  #  Bugün her şey düz HTTP üzerinden gidiyor. Bunun somut anlamı:
  #    • Giriş şifresi ağda AÇIK metin,
  #    • Oturum çerezleri `Secure` bayrağı taşıyamıyor (taşısa gönderilmezdi),
  #    • KVKK açısından özel nitelikli veri (kullanıcı fotoğrafı) korumasız
  #      bir kanaldan geçiyor.
  #
  #  Domain bağlandığında:
  #    certbot --nginx -d <alan-adi> -d www.<alan-adi>
  #  ve ardından `server_name` güncellenip 80 → 443 yönlendirmesi eklenir.
  # ═════════════════════════════════════════════════════════════════════════
}
