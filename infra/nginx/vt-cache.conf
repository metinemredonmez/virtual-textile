# ═══════════════════════════════════════════════════════════════════════════
#  nginx — medya önbellek HAVUZU (yalnızca havuz tanımı)
#
#  Kurulum:
#    cp infra/nginx/vt-cache.conf /etc/nginx/conf.d/vt-cache.conf
#    install -d -o www-data -g www-data -m 0700 /var/cache/nginx/vt-medya
#    nginx -t && systemctl reload nginx
#
#  ⚠️ NEDEN AYRI DOSYA — `vt.conf`a KONULAMAZ.
#     `proxy_cache_path` YALNIZCA `http{}` bağlamında geçerlidir. `vt.conf`
#     baştan sona tek bir `server{}` bloğudur; oraya konursa `nginx -t`
#     "directive is not allowed here" der ve dağıtım o adımda durur.
#     `/etc/nginx/conf.d/*.conf` Ubuntu'nun varsayılan `nginx.conf`unda
#     `http{}` içinden include edilir — doğru bağlam burasıdır.
#
#  ⚠️ DİZİN nginx TARAFINDAN OLUŞTURULMAZ. `proxy_cache_path` var olmayan
#     dizini kendisi yaratır AMA üst dizin yoksa ve izinler tutmuyorsa
#     başlangıçta hata verir. Dizini `scripts/deploy.sh` açıyor (bkz. "medya
#     önbelleği" adımı); elle kurulumda yukarıdaki `install` satırı.
#
#  ⚠️ BU BİR KÖPRÜDÜR. R2'ye özel alan adı bağlandığı gün bu dosya, `vt.conf`
#     içindeki `location /medya/` bloğu ve `NEXT_PUBLIC_MEDIA_URL`in `/medya`
#     yönlendirmesi BİRLİKTE kaldırılır. Gerekçe: docs/medya-dagitimi.md
# ═══════════════════════════════════════════════════════════════════════════

# levels=1:2   → tek dizinde on binlerce dosya tutmamak için iki kademe.
# keys_zone    → 20 MB paylaşılan bellek ≈ 160.000 anahtar. Bugün ~46 nesne var;
#                10.000 ürün × 4 görsel senaryosunda bile rahat.
# max_size=10g → disk tavanı. 10.000 ürün × 4 görsel × ~200 KB ≈ 8 GB.
#                ⚠️ Bu sayı diskle birlikte düşünülür: tavan boş alandan büyükse
#                nginx diski doldurur ve KOMŞU PROJELERİ de durdurur.
# inactive=90d → 90 gün hiç istenmeyen nesne, süresi dolmamış olsa da düşer.
# use_temp_path=off → geçici dosya doğrudan önbellek dizinine yazılır; ayrı
#                bir dizine yazılıp taşınması aynı dosya sisteminde bile
#                gereksiz bir kopyalamadır.
proxy_cache_path /var/cache/nginx/vt-medya
                 levels=1:2
                 keys_zone=vt_medya:20m
                 max_size=10g
                 inactive=90d
                 use_temp_path=off;
